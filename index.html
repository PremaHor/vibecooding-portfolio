<!doctype html>

    <!-- Critical CSS: LCP hero + FOUC fix, minimal inline pro rychlý first paint -->
    <style>
      html,body{background-color:#050505!important;color:#fff;margin:0;min-height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
      #root{min-height:100vh}
      .no-fouc #root{opacity:0!important;pointer-events:none}
      /* LCP hero + navbar (FOUC-free při async CSS) */
      .font-display{font-family:"Montserrat",system-ui,sans-serif;font-weight:700;letter-spacing:.03em}
      .hero-section .hero-content h1 span{display:block;background:linear-gradient(to bottom right,#fff,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;color:transparent}
      nav{position:fixed;top:0;left:0;width:100%;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;color:rgba(255,255,255,.9);gap:.5rem}
      nav a:not(.nav-cta),nav button{color:inherit}
      .nav-cta{color:#000}
      @media(min-width:768px){.hero-section .hero-content h1 span,.hero-section .hero-content>p,.hero-section .hero-content>div:last-child{opacity:0}}
      .pt-nav-safe{padding-top:calc(6rem + env(safe-area-inset-top,0))}
      @media(min-width:640px){.pt-nav-safe{padding-top:calc(7rem + env(safe-area-inset-top,0))}}
      @media(min-width:768px){.pt-nav-safe{padding-top:calc(8rem + env(safe-area-inset-top,0))}}
    </style>

        var l=(navigator.language||navigator.userLanguage||'').toLowerCase();
        document.documentElement.lang=(l.startsWith('cs')||l.startsWith('sk'))?'cs':'en';
        document.documentElement.classList.add('no-fouc');
      })();
    </script>
