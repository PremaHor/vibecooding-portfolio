      /* LCP hero + navbar (FOUC-free při async CSS) */
      .font-display{font-family:"Montserrat",system-ui,sans-serif;font-weight:700;letter-spacing:.03em}
      #pre h1{font-size:clamp(1.65rem,4.2vw,2.75rem);line-height:1.1;margin-bottom:1.5rem;text-transform:uppercase;letter-spacing:.04em}

      @media(min-width:768px){#pre h1{font-size:clamp(2.35rem,5vw,4.35rem);letter-spacing:.06em}}
      @media(min-width:1024px){#pre h1{font-size:clamp(2.85rem,4.8vw,5.6rem);letter-spacing:.065em}}
      .hero-section .hero-content h1 .hero-h1-tagline,#pre .hero-h1-tagline{display:block;color:#050505}
      nav{position:fixed;top:0;left:0;width:100%;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;color:rgba(255,255,255,.9);gap:.5rem}
      nav a:not(.nav-cta),nav button{color:inherit}
      .nav-cta.bg-white{color:#000}
      .nav-cta.bg-black{color:#fff}
      @keyframes hfi{from{opacity:1;transform:translateY(1.25rem)}to{opacity:1;transform:none}}
      @keyframes pfi{from{opacity:0}to{opacity:1}}
      @media(min-width:768px){
        .hero-anim{animation:hfi .7s cubic-bezier(.16,1,.3,1) both}
        .hero-anim-d1{animation-delay:.12s}
        .hero-anim-d2{animation-delay:.24s}
      }
      .page-fade-in{animation:pfi .4s ease both}
      @keyframes csi{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
      @keyframes cso{from{transform:translateY(0);opacity:1}to{transform:translateY(100%);opacity:0}}
      .cookie-enter{animation:csi .4s cubic-bezier(.16,1,.3,1) both}
      .cookie-exit{animation:cso .3s ease-in both}
      .pt-nav-safe{padding-top:calc(6rem + env(safe-area-inset-top,0))}
      @media(min-width:640px){.pt-nav-safe{padding-top:calc(7rem + env(safe-area-inset-top,0))}}
      @media(min-width:768px){.pt-nav-safe{padding-top:calc(8rem + env(safe-area-inset-top,0))}}
      .skip-link{position:absolute;top:-100%;left:1rem;z-index:10000;padding:0.75rem 1.25rem;background:#9ef01a;color:#000;font-weight:700;text-decoration:none;border-radius:0.5rem;transition:top .2s ease}
      .skip-link:focus{top:1rem;outline:2px solid #050505;outline-offset:2px}
